<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>IPTV Diag</title>
<style>
  body { margin: 0; background: #0b0f19; color: #e6e9ef; font: 20px/1.35 sans-serif; padding: 32px 48px; }
  h1 { font-size: 30px; margin: 0 0 16px; }
  #spin { display: inline-block; width: 18px; height: 18px; background: #4f7cff; margin-left: 12px; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  pre { white-space: pre-wrap; font: 17px/1.3 monospace; margin: 0; }
</style>
</head>
<body>
<h1>Diagnóstico IPTV <span id="spin"></span></h1>
<pre id="log"></pre>
<script src="config.js"></script>
<script src="diag.js"></script>
</body>
</html>
