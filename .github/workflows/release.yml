# Cada tag vX.Y.Z (bun run release + git push --follow-tags):
#   1. vira um release no GitHub com o nyx.wgt anexado. É de lá que os instaladores de
#      celular e PC (Apps2Samsung, TV Installer…) baixam o Nyx;
#   2. vai para o GitHub Pages (victorreinor.github.io/nyx-tv/update/), de onde as TVs que
#      já têm o Nyx baixam a versão nova sozinhas (atualização sem cabo, ver src/boot/).
name: release

on:
  push:
    tags: ['v*']

# um deploy do Pages por vez, sem cancelar o que já começou
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  wgt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test
      - run: bun run wgt
      - name: Publica o release com o nyx.wgt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PKG="$(bun -e 'console.log(require("./package.json").version)')"
          [ "$PKG" = "$VERSION" ] || { echo "a tag $TAG não bate com o package.json ($PKG)"; exit 1; }
          # notas = a seção desta versão no CHANGELOG
          awk -v h="## [$VERSION]" 'index($0, h) == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > notes.md
          printf '\n---\n📲 Como instalar na TV: https://github.com/%s/blob/main/docs/INSTALAR.md\n' "$GITHUB_REPOSITORY" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .build/release/nyx.wgt --clobber
          else
            gh release create "$TAG" .build/release/nyx.wgt --title "Nyx $VERSION" --notes-file notes.md --verify-tag
          fi
      # mesmo build do nyx.wgt (scripts/pages.ts): manifest.json + app.js + worker.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .build/pages

  pages:
    needs: wgt
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}update/manifest.json
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
